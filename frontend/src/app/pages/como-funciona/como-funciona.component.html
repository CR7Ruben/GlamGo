<div class="page-container">
    <div class="landing-card">

        <app-navbar></app-navbar>

        <main class="content">

            <!-- Encabezado -->
            <section class="page-header">
                <h1 class="page-title">
                    ¿Cómo funciona <span class="brand">Glam<span class="gold-text">Go</span></span>?
                </h1>
                <p class="page-subtitle">
                    Reservar tu próximo servicio de belleza es fácil: solo sigue estos cuatro pasos.
                </p>
            </section>

            <!-- Pasos -->
            <section class="steps">
                <article class="step" *ngFor="let p of pasos; let i = index">
                    <span class="step-number">{{ i + 1 }}</span>

                    <div class="step-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round">
                            <ng-container [ngSwitch]="p.icono">

                                <ng-container *ngSwitchCase="'buscar'">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    <line x1="11" y1="10" x2="11" y2="14"></line>
                                    <circle cx="11" cy="7.6" r="0.4"></circle>
                                </ng-container>

                                <ng-container *ngSwitchCase="'comparar'">
                                    <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                                    <rect x="7" y="7" width="10" height="10" rx="2"></rect>
                                    <line x1="10" y1="10" x2="14" y2="10"></line>
                                    <line x1="10" y1="14" x2="14" y2="14"></line>
                                </ng-container>

                                <ng-container *ngSwitchCase="'reservar'">
                                    <rect x="3" y="4" width="18" height="18" rx="3"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                    <line x1="8" y1="14" x2="9" y2="14"></line>
                                    <line x1="12" y1="14" x2="13" y2="14"></line>
                                    <line x1="16" y1="14" x2="17" y2="14"></line>
                                </ng-container>

                                <ng-container *ngSwitchCase="'resenas'">
                                    <polygon
                                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                                    </polygon>
                                </ng-container>

                            </ng-container>
                        </svg>
                    </div>

                    <h3 class="step-title">{{ p.titulo }}</h3>
                    <p class="step-text">{{ p.texto }}</p>
                </article>
            </section>

            <!-- Preguntas frecuentes -->
            <section class="faq">
                <h2 class="section-title">Preguntas frecuentes</h2>

                <div class="faq-item" *ngFor="let q of preguntas; let i = index" [class.open]="abierta === i">
                    <button type="button" class="faq-question" [attr.aria-expanded]="abierta === i" (click)="toggle(i)">
                        <span>{{ q.pregunta }}</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <p class="faq-answer" *ngIf="abierta === i">{{ q.respuesta }}</p>
                </div>
            </section>

            <!-- Llamado a la acción -->
            <section class="cta">
                <h2 class="cta-title">¿Lista para empezar?</h2>
                <p class="cta-text">Encuentra tu próximo servicio de belleza y reserva hoy mismo.</p>
                <div class="cta-actions">
                    <a routerLink="/categorias" class="btn btn-primary">Explorar categorías</a>
                </div>
            </section>

        </main>
    </div>
</div>
