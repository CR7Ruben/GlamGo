<div class="page-container">
  <article class="legal-card">

    <header class="legal-header">
      <a routerLink="/" class="logo">Glam<span>Go</span></a>
      <a routerLink="/" class="back-btn">← Volver al inicio</a>
    </header>

    <h1>{{ documento.titulo }}</h1>
    <p class="actualizado">Última actualización: {{ actualizado }}</p>

    <section class="seccion" *ngFor="let s of documento.secciones">
      <h2>{{ s.titulo }}</h2>
      <p *ngFor="let p of s.parrafos">{{ p }}</p>
    </section>

    <footer class="legal-footer">
      <a [routerLink]="otro.ruta">{{ otro.texto }}</a>
    </footer>

  </article>
</div>
