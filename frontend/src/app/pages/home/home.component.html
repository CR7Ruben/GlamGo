<div class="page-container">
  <div class="landing-card">

    <app-navbar></app-navbar>

    <!-- Hero -->
    <main class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">
          Tu belleza,<br>
          <span class="pink-text">nuestra prioridad</span>
        </h1>

        <p class="hero-description">
          Encuentra los mejores servicios de belleza<br>
          cerca de ti y reserva en un solo lugar.
        </p>

        <button class="btn btn-primary btn-lg" routerLink="/categorias">
          Explorar servicios
          <span class="arrow">&rarr;</span>
        </button>
      </div>

      <div class="hero-visual">
        <div class="blob-bg"></div>

        <!-- Flecha dibujada -->
        <svg class="arrow-draw" viewBox="0 0 60 70" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M55 3 C 48 20, 40 38, 14 58"></path>
          <path d="M6 48 L 13 59 L 25 56"></path>
        </svg>

        <!-- Estrellas -->
        <svg class="decor-star star-1" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0 C12.8 7.5 16.5 11.2 24 12 C16.5 12.8 12.8 16.5 12 24 C11.2 16.5 7.5 12.8 0 12 C7.5 11.2 11.2 7.5 12 0Z">
          </path>
        </svg>
        <svg class="decor-star star-2" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0 C12.8 7.5 16.5 11.2 24 12 C16.5 12.8 12.8 16.5 12 24 C11.2 16.5 7.5 12.8 0 12 C7.5 11.2 11.2 7.5 12 0Z">
          </path>
        </svg>

        <img src="assets/hero-model.jpeg" alt="Modelo GlamGo" class="hero-image">
      </div>
    </main>

      <div class="feature-item">
